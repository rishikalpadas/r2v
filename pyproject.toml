[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raster2vector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "pillow",
    "resvg-py",
    "svgelements",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "vtracer"]

[tool.setuptools.packages.find]
include = ["engine*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds (large-image performance checks)"]
